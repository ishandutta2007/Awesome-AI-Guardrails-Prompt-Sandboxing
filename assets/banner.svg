ansform-origin:1000px 250px;animation:pulseOrb 10s ease-in-out infinite alternate-reverse}.shield-container{transform-origin:100px 210px;animation:pulseShield 4s ease-in-out infinite}.pill-1{animation:floatPill 5s ease-in-out infinite}.pill-2{animation:floatPill 6s ease-in-out infinite .7s}.pill-3{animation:floatPill 5.5s ease-in-out infinite 1.4s}.pill-4{animation:floatPill 6.2s ease-in-out infinite 2.1s}.scanner{animation:scanLine 6s linear infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#cyberGrid)"/><circle cx="220" cy="140" r="130" fill="#00f2fe" class="orb-cyan" filter="url(#ambientGlow)"/><circle cx="1020" cy="260" r="150" fill="#7f00ff" class="orb-purple" filter="url(#ambientGlow)"/><circle cx="650" cy="80" r="90" fill="#38ef7d" filter="url(#ambientGlow)" opacity=".15"/><rect width="1200" height="3" x="0" y="0" fill="url(#textGrad)" class="scanner"/><g class="shield-container" transform="translate(45, 0)"><path fill="none" stroke="url(#shieldGrad)" stroke-width="3" d="M 120 100 L 190 135 C 190 220 140 280 120 300 C 100 280 50 220 50 135 Z" filter="url(#cyanGlow)"/><path fill="rgba(0, 242, 254, 0.08)" stroke="#00f2fe" stroke-width="1.5" d="M 120 125 L 170 152 C 170 215 135 258 120 273 C 105 258 70 215 70 152 Z"/><rect width="24" height="24" x="108" y="180" fill="#00f2fe" opacity=".85" rx="4"/><circle cx="120" cy="172" r="7" fill="none" stroke="#00f2fe" stroke-width="3"/><line x1="120" x2="120" y1="210" y2="245" stroke="#38ef7d" stroke-dasharray="3 3" stroke-width="2"/><circle cx="120" cy="248" r="4" fill="#38ef7d"/></g><g transform="translate(260, 0)"><rect width="280" height="28" x="0" y="70" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1" rx="14"/><text x="14" y="89" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">🛡️ AI CYBERSECURITY &amp; AGENT DEFENSE</text><