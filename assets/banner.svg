<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#060814" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#38ef7d" />
      <stop offset="70%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.15)" />
      <stop offset="100%" stop-color="rgba(157, 78, 221, 0.15)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.6; }
    }
    @keyframes pulseShield {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.4)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.85)); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes scanLine {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    .orb-cyan {
      transform-origin: 200px 150px;
      animation: pulseOrb 8s ease-in-out infinite alternate;
    }
    .orb-purple {
      transform-origin: 1000px 250px;
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
    }
    .shield-container {
      transform-origin: 100px 210px;
      animation: pulseShield 4s ease-in-out infinite;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 6s ease-in-out infinite 0.7s; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 1.4s; }
    .pill-4 { animation: floatPill 6.2s ease-in-out infinite 2.1s; }
    .scanner {
      animation: scanLine 6s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Cybernetic Grid Overlay -->
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="orb-cyan" cx="220" cy="140" r="130" fill="#00f2fe" filter="url(#ambientGlow)" />
  <circle class="orb-purple" cx="1020" cy="260" r="150" fill="#7f00ff" filter="url(#ambientGlow)" />
  <circle cx="650" cy="80" r="90" fill="#38ef7d" opacity="0.15" filter="url(#ambientGlow)" />

  <!-- Dynamic Cyber Scan Line in Background -->
  <rect class="scanner" x="0" y="0" width="1200" height="3" fill="url(#textGrad)" />

  <!-- Left Side: Glowing Security Shield & Sandbox Core Visual -->
  <g class="shield-container" transform="translate(45, 0)">
    <!-- Outer Shield Contour -->
    <path d="M 120 100 L 190 135 C 190 220 140 280 120 300 C 100 280 50 220 50 135 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#cyanGlow)" />
    <!-- Inner Cyber Lock / Kernel -->
    <path d="M 120 125 L 170 152 C 170 215 135 258 120 273 C 105 258 70 215 70 152 Z" 
          fill="rgba(0, 242, 254, 0.08)" stroke="#00f2fe" stroke-width="1.5" />
    <!-- Center Keyhole / MicroVM Box -->
    <rect x="108" y="180" width="24" height="24" rx="4" fill="#00f2fe" opacity="0.85" />
    <circle cx="120" cy="172" r="7" fill="none" stroke="#00f2fe" stroke-width="3" />
    <!-- MicroVM Rays -->
    <line x1="120" y1="210" x2="120" y2="245" stroke="#38ef7d" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="120" cy="248" r="4" fill="#38ef7d" />
  </g>

  <!-- Foreground Main Title & Badging (Ensured strictly on top and unobstructed) -->
  <g transform="translate(260, 0)">
    <!-- Category Badge Tag -->
    <rect x="0" y="70" width="280" height="28" rx="14" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1" />
    <text x="14" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="1.5">🛡️ AI CYBERSECURITY &amp; AGENT DEFENSE</text>

    <!-- Main Repository Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome <tspan fill="url(#textGrad)">AI Guardrails</tspan>
    </text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#e2e8f0" letter-spacing="-0.5">
      &amp; Prompt Sandboxing
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Defending autonomous agents, LLMs &amp; code-interpreters against prompt injection &amp; jailbreaks
    </text>

    <!-- Animated Feature Pills (Placed safely below typography) -->
    <g transform="translate(0, 275)">
      <!-- Pill 1: Prompt Injection Defense -->
      <g class="pill-1">
        <rect x="0" y="0" width="195" height="34" rx="17" fill="url(#pillGrad)" stroke="#00f2fe" stroke-width="1.2" />
        <text x="15" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38ef7d">⚡ Prompt Injection</text>
      </g>

      <!-- Pill 2: Agent Sandboxing -->
      <g class="pill-2" transform="translate(205, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="url(#pillGrad)" stroke="#4facfe" stroke-width="1.2" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#00f2fe">🔒 MicroVM Sandboxing</text>
      </g>

      <!-- Pill 3: Red Teaming -->
      <g class="pill-3" transform="translate(380, 0)">
        <rect x="0" y="0" width="170" height="34" rx="17" fill="url(#pillGrad)" stroke="#9d4edd" stroke-width="1.2" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#c77dff">🎯 Adversarial Red-Team</text>
      </g>

      <!-- Pill 4: PII Masking -->
      <g class="pill-4" transform="translate(560, 0)">
        <rect x="0" y="0" width="155" height="34" rx="17" fill="url(#pillGrad)" stroke="#ff007f" stroke-width="1.2" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ff70a6">🛡️ PII &amp; Secrets Rails</text>
      </g>
    </g>

    <!-- Bottom Metrics & Tech Badges -->
    <g transform="translate(0, 345)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">
        ECOSYSTEM COVERAGE:
      </text>
      <text x="160" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">
        Firecracker MicroVMs <tspan fill="#475569">|</tspan> gVisor <tspan fill="#475569">|</tspan> NeMo Guardrails <tspan fill="#475569">|</tspan> Llama Guard 3 <tspan fill="#475569">|</tspan> PyRIT <tspan fill="#475569">|</tspan> Gitleaks
      </text>
    </g>
  </g>

  <!-- High-tech Outer Border Glow -->
  <rect x="1" y="1" width="1198" height="418" rx="8" fill="none" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" />
</svg>
